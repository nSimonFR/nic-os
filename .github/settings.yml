# These settings are synced to GitHub by https://github.com/probot/settings

repository:
  name: nic-os
  description: "\U0001F4BB My nixOS / macOS configurations !"
  homepage: ""
  topics: dotfiles, nix, nix-darwin, nixos
  private: false
  has_issues: true
  has_projects: true
  has_wiki: true
  has_downloads: true
  default_branch: main
  allow_squash_merge: false
  allow_merge_commit: false
  allow_rebase_merge: true
  delete_branch_on_merge: false
  # Lets a PR be armed with "auto-merge" and land itself once its gates pass —
  # the required review below plus the four required status checks. Repo-level
  # permission only: it never merges anything on its own, someone still has to
  # arm each PR (the button, or `gh pr merge --auto --rebase`).
  allow_auto_merge: true

labels:
  - name: bug
    color: d73a4a
    description: Something isn't working
  - name: documentation
    color: 0075ca
    description: Improvements or additions to documentation
  - name: duplicate
    color: cfd3d7
    description: This issue or pull request already exists
  - name: enhancement
    color: a2eeef
    description: New feature or request
  - name: good first issue
    color: 7057ff
    description: Good for newcomers
  - name: help wanted
    color: 008672
    description: Extra attention is needed
  - name: invalid
    color: e4e669
    description: This doesn't seem right
  - name: question
    color: d876e3
    description: Further information is requested
  - name: wontfix
    color: ffffff
    description: This will not be worked on

# probot/settings reconciles this file on push to the default branch, so nothing
# below takes effect until the PR carrying it merges — and between merges the
# live settings can drift from what is written here (a toggle in the web UI is
# not reverted until the next push that touches this file). If you are comparing
# `gh api repos/nSimonFR/nic-os/branches/main/protection` against this and they
# disagree, that is the likely reason, not a broken app.
#
# One footgun worth knowing: `null` here means "do not manage", not "remove".
# 00fd1e9 set `required_pull_request_reviews: null` expecting it to drop the
# review requirement; the requirement is still live today.
branches:
  - name: main
    protection:
      # The review lives in the repository ruleset "main" (id 14715738), not here:
      # classic protection takes an App in its bypass list only on organisation
      # repos, and this one is personal. The ruleset requires one approval, the
      # last pusher may not be the approver, a push drops the approval, and the
      # nic-os-renovate App (renovate.json automerge) is its only bypass actor.
      # nSimonFR-ai is shared with the agents and must never be one.
      # `null` is "do not manage": the classic rule was removed through the API.
      # Putting a review block back here would block the App again.
      required_pull_request_reviews: null
      # The four jobs of .github/workflows/nix.yml, plus `hashes` from
      # nix-hashes.yml. These are the context names GitHub actually reported on
      # green runs of those workflows, not names derived from the YAML — a context
      # that never arrives leaves every PR waiting forever on a check that will
      # not come.
      #
      # So: if you rename a job in nix.yml, rename it here in the same commit.
      #
      # `hashes` is required for the same reason it exists: eval cannot see a
      # stale fixed-output hash, so before it, a Renovate bump with two dead
      # hashes was green on all four checks and merged straight into an
      # unbuildable main (2026-08-19). It is why nix-hashes.yml has no `paths:`
      # filter — a required context must report on every PR, including the ones
      # that touch nothing under pkgs/.
      #
      # strict is false on purpose. `true` additionally requires a branch to be
      # up to date with main before merging, which on a rebase-only repo means
      # re-running all four checks after every unrelated merge.
      required_status_checks:
        strict: false
        contexts:
          - eval rpi5
          - eval BeAsT
          - eval nBookPro
          - scripts
          - hashes
          # `build rpi5` is the only check that builds: eval passes on a
          # package that fails to build. It also builds what Hydra has not
          # (nodejs 26.9.0 = ~4h of V8) within its 345 min, before deploy-rpi5's
          # 180 min run on main has to.
          # Like `hashes`, it reports on every PR rather than filtering on
          # paths, because a required context that never arrives leaves a PR
          # waiting forever.
          - build rpi5
      # Off, deliberately, and this is a change from what this file used to
      # declare. It is the escape hatch: with a required review and four required
      # checks, `true` means a CI outage — a runner incident, a bad flake input,
      # a rate-limited substituter — locks main until CI recovers, including
      # locking the PR that would fix it. On a single-maintainer repo that is a
      # worse failure than the one it prevents.
      #
      # It does not weaken the normal path: the gates still apply, an override is
      # a deliberate act.
      enforce_admins: false
      restrictions: null

# The repository ruleset, which holds the PR review rule (classic protection above
# keeps only the checks). probot/settings matches by `name`, compares the whole
# object with what GitHub returns, and DELETES any ruleset not listed here — so
# keep every field, in GitHub's rule order, and add rulesets here rather than in
# the UI.
#
# nic-os-renovate (App 5756929) is the only bypass actor: it lets Renovate merge
# claude-code bumps without a review (renovate.json). nSimonFR-ai is shared with
# the agents and must never be one.
rulesets:
  - name: main
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - "~DEFAULT_BRANCH"
        exclude: []
    bypass_actors:
      - actor_id: 5756929
        actor_type: Integration
        bypass_mode: always
    rules:
      - type: deletion
      - type: non_fast_forward
      - type: required_linear_history
      - type: pull_request
        parameters:
          required_approving_review_count: 1
          dismiss_stale_reviews_on_push: true
          required_reviewers: []
          require_code_owner_review: false
          require_last_push_approval: true
          required_review_thread_resolution: false
          require_extra_approval_for_unattributed_changes: true
          allowed_merge_methods:
            - rebase
  # Disabled and inert: if this shows up under `gh api repos/nSimonFR/nic-os/rulesets`
  # after the merge, probot applies `rulesets:`. Remove it in the next PR.
  - name: probe
    target: branch
    enforcement: disabled
    conditions:
      ref_name:
        include:
          - refs/heads/probe-nonexistent
        exclude: []
    bypass_actors: []
    rules:
      - type: deletion
