# Self-hosted Renovate. Replaces the Mend-hosted app, which cannot run
# postUpgradeTasks: here the pkgs/** hash recompute (renovate.json) lands in the
# same commit as the version bump.
#
# Runs on the runner, not in the renovate container, so the tasks see the Nix
# installed below. The token is minted per run from a GitHub App (1h lifetime):
# GITHUB_TOKEN pushes would not trigger the required checks, and it can never
# get the `workflows` permission the github-actions manager needs.
name: Renovate

on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Resolve the app's commit identity
        id: author
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)
          echo "git=${SLUG}[bot] <${id}+${SLUG}[bot]@users.noreply.github.com>" >>"$GITHUB_OUTPUT"

      - uses: DeterminateSystems/nix-installer-action@v22

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Run Renovate
        env:
          # renovate: datasource=npm depName=renovate
          RENOVATE_VERSION: 44.112.2
          RENOVATE_TOKEN: ${{ steps.app.outputs.token }}
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_BINARY_SOURCE: global
          RENOVATE_GIT_AUTHOR: ${{ steps.author.outputs.git }}
          # Adopt the branches the Mend app left behind instead of treating them
          # as hand-modified and freezing them.
          RENOVATE_GIT_IGNORED_AUTHORS: '["29139614+renovate[bot]@users.noreply.github.com"]'
          RENOVATE_ALLOWED_COMMANDS: '["^python3 scripts/nix-fix-hashes\\.py --write pkgs/\\S+\\.nix$"]'
          LOG_LEVEL: info
        run: npx --yes "renovate@${RENOVATE_VERSION}"
