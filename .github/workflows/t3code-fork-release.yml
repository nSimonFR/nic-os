# Builds the nSimonFR-ai/t3code `-issues.1` release for a t3code nightly bump.
#
# Renovate bumps `version` in pkgs/agents/t3code.nix, but both t3code packages
# install the fork's build of that nightly (upstream's nightly + the Issues
# stack, spec.md in the fork), which exists only once someone builds it. This
# does: merge the nightly into the fork branch, gate it, build the linux-arm64
# archive and the macOS app, publish the release, and pin the new hashes on the
# PR. A PR whose release already exists only gets its hashes pinned.
#
# A merge that conflicts beyond the lockfile, or a failing gate, stops here with
# a PR comment: that needs a person, with the fork's spec.md.
#
# Lives here, not in the fork: nSimonFR-ai's bot token cannot push workflows
# there, and the fork's .github/workflows must stay identical to its main.
name: T3 Code fork release

on:
  pull_request:
    branches: [main]
    paths:
      - pkgs/agents/t3code.nix
      - pkgs/agents/t3code-desktop.nix
      - .github/workflows/t3code-fork-release.yml
      - scripts/t3code-fork/**
  workflow_dispatch:
    inputs:
      version:
        description: Nightly to build (default, the version in pkgs/agents/t3code.nix)
        required: false

concurrency:
  group: t3code-fork-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    shell: bash

env:
  FORK: nSimonFR-ai/t3code
  GH_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
  # Public T3 Connect config; a build without it silently has Connect off.
  T3CODE_RELAY_URL: https://relay.t3.codes
  T3CODE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsudDMuY29kZXMk
  T3CODE_CLERK_JWT_TEMPLATE: t3-relay
  T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: hzxSgY2cH10sDU2r

jobs:
  plan:
    name: plan
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      built: ${{ steps.plan.outputs.built }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}
          token: ${{ secrets.RENOVATE_TOKEN }}
      - id: plan
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=${INPUT_VERSION:-$(sed -nE 's/^ *version = "([^"]+)";.*/\1/p' pkgs/agents/t3code.nix | head -1)}
          tag=v$version-issues.1
          if gh release view "$tag" --repo "$FORK" >/dev/null 2>&1; then built=true; else built=false; fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "built=$built"
          } >>"$GITHUB_OUTPUT"
          echo "$tag: release exists=$built" >>"$GITHUB_STEP_SUMMARY"

  build:
    name: fork + linux-arm64
    needs: plan
    if: needs.plan.outputs.built == 'false'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    outputs:
      sha: ${{ steps.push.outputs.sha }}
      branch: ${{ steps.push.outputs.branch }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: nicos
          sparse-checkout: scripts/t3code-fork
      - name: Check out the fork
        run: |
          set -euo pipefail
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${FORK}.git" t3code
          git -C t3code remote add up https://github.com/pingdotgg/t3code.git
          git -C t3code config user.name nSimonFR-ai
          git -C t3code config user.email 265587706+nSimonFR-ai@users.noreply.github.com

      - name: Merge the nightly
        working-directory: t3code
        run: ../nicos/scripts/t3code-fork/merge-upstream.sh "$VERSION" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: t3code/package.json
          run-install: false

      - name: Install, stamp the version, gate, push
        id: push
        working-directory: t3code
        run: ../nicos/scripts/t3code-fork/prepare.sh

      - name: Build the linux-arm64 archive
        run: nicos/scripts/t3code-fork/build-linux.sh

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: out/*
          if-no-files-found: error

  mac:
    name: macOS app
    needs: [plan, build]
    runs-on: macos-15
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/t3code-fork
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: dl
      - name: Repack upstream's app with the fork's server
        run: scripts/t3code-fork/build-mac.sh
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: out/*
          if-no-files-found: error

  release:
    name: publish release
    needs: [plan, build, mac]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      SHA: ${{ needs.build.outputs.sha }}
      BRANCH: ${{ needs.build.outputs.branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: nicos
          sparse-checkout: scripts/t3code-fork
      - uses: actions/download-artifact@v8
        with:
          pattern: "{linux,mac}"
          path: dl
          merge-multiple: true
      - name: Publish
        run: nicos/scripts/t3code-fork/release.sh

  pin:
    name: pin hashes
    needs: [plan, release]
    if: always() && github.event_name == 'pull_request' && needs.plan.result == 'success' && (needs.plan.outputs.built == 'true' || needs.release.result == 'success')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.RENOVATE_TOKEN }}
      # The PR branch may predate the scripts; the merge ref has them.
      - uses: actions/checkout@v7
        with:
          path: nicos
          sparse-checkout: scripts/t3code-fork
      - name: Pin the release assets
        run: nicos/scripts/t3code-fork/pin.sh

  report:
    name: report failure
    needs: [plan, build, mac, release, pin]
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD: ${{ needs.build.result }}
          MAC: ${{ needs.mac.result }}
          RELEASE: ${{ needs.release.result }}
          PIN: ${{ needs.pin.result }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --body \
            "The fork release for \`${{ needs.plan.outputs.tag }}\` was not built: [run]($RUN) (fork+linux: $BUILD, mac: $MAC, release: $RELEASE, pin: $PIN). A merge conflict or a failing gate needs the fork's \`spec.md\`: resolve it on the fork's \`nicos/issues-nightly-*\` branch, publish the release by hand, then re-run this workflow."
