# Build rpi5's system here, push it to nsimon-nicos, and have the Cachix Deploy
# agent on the Pi (hosts/rpi5/platform/cachix-agent.nix) download and activate it.
#
# The Pi cannot evaluate its own config: the eval peaks at ~2.1 GiB RSS and
# earlyoom SIGTERMs it (2026-10-01). Its closure is ~25 GiB,
# hence the disk cleanup before the build.
name: Deploy rpi5

on:
  push:
    branches: [main]
  # Safety net for pushes that start no run (anything landed via GITHUB_TOKEN).
  # Auto-merge arms with a PAT, so its merges trigger `push` directly.
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Activate even if this system was already activated
        type: boolean
        default: false

concurrency:
  group: deploy-rpi5
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy rpi5
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: cachix/cachix-action@v17
        with:
          name: nsimon-nicos
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      # A toplevel in nsimon-nicos is not proof it was activated: the `build rpi5`
      # job pushes one whenever a nixpkgs bump renames it. Only a successful
      # Activate writes the marker, so a failed one is retried on the next run.
      - name: Evaluate
        id: eval
        run: |
          set -euo pipefail
          out=$(nix eval --accept-flake-config --raw \
            .#nixosConfigurations.rpi5.config.system.build.toplevel.outPath)
          hash=${out#/nix/store/}
          hash=${hash%%-*}
          echo "out=$out" >> "$GITHUB_OUTPUT"
          echo "System: $out" # read by scripts/wait-deploy
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "System: \`$out\`" >> "$GITHUB_STEP_SUMMARY"
          if curl -sfI -o /dev/null "https://nsimon-nicos.cachix.org/$hash.narinfo"; then
            echo "cached=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Look up the deployed marker
        id: marker
        if: inputs.force != true
        uses: actions/cache/restore@v6
        with:
          path: .deployed
          key: rpi5-deployed-${{ steps.eval.outputs.hash }}
          lookup-only: true

      - name: Decide
        id: plan
        env:
          DEPLOYED: ${{ steps.marker.outputs.cache-hit }}
          CACHED: ${{ steps.eval.outputs.cached }}
        run: |
          if [ "$DEPLOYED" = true ]; then
            echo "Already activated, nothing to deploy." >> "$GITHUB_STEP_SUMMARY"
            echo "activate=false" >> "$GITHUB_OUTPUT"
          else
            echo "activate=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$DEPLOYED" != true ] && [ "$CACHED" != true ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        if: steps.plan.outputs.build == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      - name: Build
        if: steps.plan.outputs.build == 'true'
        run: |
          nix build --accept-flake-config --no-link --print-build-logs \
            .#nixosConfigurations.rpi5.config.system.build.toplevel
          df -h /

      # `cachix push` always uploads the full closure (cachix 1.9.1). Cachix drops
      # cache.nixos.org paths itself, but nixos-raspberrypi's kernel and firmware
      # are stored again here, counted against the 5 GB free plan.
      - name: Push to Cachix
        if: steps.plan.outputs.build == 'true'
        env:
          OUT: ${{ steps.eval.outputs.out }}
        run: cachix push nsimon-nicos "$OUT"

      - name: Activate
        if: steps.plan.outputs.activate == 'true'
        env:
          CACHIX_ACTIVATE_TOKEN: ${{ secrets.CACHIX_ACTIVATE_TOKEN }}
          OUT: ${{ steps.eval.outputs.out }}
        run: |
          jq -n --arg out "$OUT" '{agents: {rpi5: $out}}' > deploy.json
          cachix deploy activate deploy.json
          echo "$OUT" > .deployed

      - name: Save the deployed marker
        if: steps.plan.outputs.activate == 'true'
        uses: actions/cache/save@v6
        with:
          path: .deployed
          key: rpi5-deployed-${{ steps.eval.outputs.hash }}

      # Keep the deployed system's whole closure in Cachix. The free plan is 5 GB
      # across every cache, collected LRU, and rpi5 (~3.6 GB of its own paths)
      # plus nBookPro (~1 GB) nearly fill it: PR pushes kept evicting unchanged
      # packages (Immich, Hermes...), and the next deploy rebuilt ~1500 of them.
      # One revision: `cachix deploy activate` above waits for the result, so the
      # pinned system is the running one. Pins count against the same 5 GB, so
      # rpi5 is the only system pinned (~3.4 GiB). If a pin fails on a large
      # bump or Cachix warns about the quota again, see NSI-121 (Storj cache).
      # Only on the activating run: it is the one run that knows which system is
      # running. A later retry cannot tell (a marker proves "was deployed", not
      # "runs now") and could pin an older system over the running one. A
      # transient failure is retried inside the step (curl --retry 5); a pin that
      # still fails is redone by the next deploy, and costs at worst a rebuild.
      - name: Pin the deployed system in Cachix
        if: steps.plan.outputs.activate == 'true'
        continue-on-error: true
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          OUT: ${{ steps.eval.outputs.out }}
        run: |
          scripts/cachix-pin rpi5 "$OUT" '{"tag":"Revisions","contents":1}'
