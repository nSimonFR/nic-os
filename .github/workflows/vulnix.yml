# Daily CVE scan of rpi5's system with vulnix.
#
# Runs here, not on the Pi: vulnix reads each store path's .drv, and the Pi only
# ever downloads outputs from Cachix, so it has no derivers to read.
#
# The scan covers build inputs too and matches by name (Haskell `zlib`, Rust
# `curl`), so the first run on 2026-10-22 found ~60 packages at CVSS >= 9. The
# job therefore fails only on a NEW (pname, CVE) pair at CVSS >= 9, against the
# set seen last run (Actions cache — daily, so it outlives the 7-day eviction).
# A missing cache re-baselines silently. Whitelist reviewed entries in
# hosts/rpi5/vulnix-whitelist.toml.
name: Vulnix

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/vulnix.yml
      - hosts/rpi5/vulnix-whitelist.toml

permissions:
  contents: read

jobs:
  scan:
    name: vulnix rpi5
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      MIN_CVSS: "9.0"
      # Optional: same bot as the Pi's alerts. Unset → the failed run is the alert.
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: "82389391"
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23

      - name: Instantiate
        id: drv
        run: |
          drv=$(nix eval --accept-flake-config --raw \
            .#nixosConfigurations.rpi5.config.system.build.toplevel.drvPath)
          echo "drv=$drv" >> "$GITHUB_OUTPUT"

      - name: Scan
        run: |
          set -o pipefail
          # Exit 2 = findings; anything else non-zero is a real failure.
          nix run --inputs-from . nixpkgs#vulnix -- --json \
            -w hosts/rpi5/vulnix-whitelist.toml "${{ steps.drv.outputs.drv }}" \
            > vulnix.json || [ $? -eq 2 ]

      - uses: actions/cache/restore@v6
        with:
          path: vulnix-seen.txt
          key: vulnix-seen-${{ github.run_id }}
          restore-keys: vulnix-seen-

      - name: Report
        id: report
        run: |
          # vulnix also exits 2 on an internal error; don't read that as "clean".
          jq -e 'type == "array"' vulnix.json > /dev/null
          jq -r --argjson min "$MIN_CVSS" '.[] | . as $p | .affected_by[]
            | select(($p.cvssv3_basescore[.] // 0) >= $min)
            | "\($p.pname) \(.) \($p.cvssv3_basescore[.])"' vulnix.json \
            | sort -u > current.txt
          if [ -f vulnix-seen.txt ]; then
            # Keyed on pname + CVE: a version bump alone is not news.
            new=$(awk 'NR==FNR { seen[$1" "$2]; next } !(($1" "$2) in seen)' \
              vulnix-seen.txt current.txt)
          else
            new=""
            echo "No previous run cached: recording a baseline."
          fi
          cp current.txt vulnix-seen.txt
          {
            echo "### vulnix rpi5"
            echo "$(jq '[.[].affected_by[]] | length' vulnix.json) matches; $(wc -l < current.txt) at CVSS >= $MIN_CVSS."
            echo "New since last run:"
            echo '```'
            echo "${new:-none}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "new: ${new:-none}"
          if [ -n "$new" ]; then
            { echo "crit<<EOF"; echo "$new"; echo "EOF"; } >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - uses: actions/cache/save@v6
        if: always() && hashFiles('vulnix-seen.txt') != ''
        with:
          path: vulnix-seen.txt
          key: vulnix-seen-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulnix
          path: vulnix.json
          if-no-files-found: ignore

      - name: Notify
        if: failure() && env.TELEGRAM_BOT_TOKEN != '' && github.event_name != 'pull_request'
        env:
          CRIT: ${{ steps.report.outputs.crit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          text=$(printf 'vulnix: new critical CVEs on rpi5\n%s\n%s' "${CRIT:-scan failed}" "$RUN_URL")
          curl -sf -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${text}"
