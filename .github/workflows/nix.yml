# Evaluate every host and run the script tests, on every PR.
#
# Until now nothing did. garnix went away on 2026-07-15 (docs/adr — see the
# known-issue note) and took the only build/eval feedback with it, so a PR that
# broke evaluation merged clean and was discovered by hand. That matters more
# here than in most repos: auto-upgrade.nix runs `nix flake update` + rebuild +
# reboot unattended every Sunday at 05:00 on a headless Pi whose documented
# recovery path is a physical power-cycle.
#
# Eval, not build. `system.build.toplevel.drvPath` forces the whole module tree —
# every module imported, every option merged, every `assertions` entry checked —
# without building a single derivation. That is the class of breakage worth
# catching (a bad flake input, a renamed option, a failed assertion, a typo'd
# path) and it costs a couple of minutes instead of an hour of ARM compilation.
#
# Everything runs on aarch64. The rpi5 config *needs* it: aperture-sync.nix reads
# the model list out of the claude-code binary with `builtins.readFile`, which is
# import-from-derivation — evaluating it builds an aarch64 derivation, so an
# x86_64 runner would need QEMU. `ubuntu-24.04-arm` is a native ARM runner, free
# for public repos. The other two configs evaluate fine there too (evaluating an
# x86_64 or a Darwin system is architecture-independent as long as no IFD is in
# the way, and neither has any), so one runner label covers all three.
name: Nix

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A force-push should cancel the run it superseded rather than queue behind it.
concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval:
    name: eval ${{ matrix.host }}
    runs-on: ubuntu-24.04-arm
    strategy:
      # One broken host should still report on the other two — the usual reason
      # a config breaks is a shared module, and knowing whether it took all
      # three down or just one is most of the diagnosis.
      fail-fast: false
      matrix:
        include:
          - host: rpi5
            output: nixosConfigurations
          - host: BeAsT
            output: nixosConfigurations
          - host: nBookPro
            output: darwinConfigurations
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      # --accept-flake-config: the flake declares nixos-raspberrypi.cachix.org,
      # which is what keeps the rpi5 job from building its inputs from source.
      - name: Evaluate ${{ matrix.host }}
        run: |
          nix eval --accept-flake-config --raw \
            ".#${{ matrix.output }}.${{ matrix.host }}.config.system.build.toplevel.drvPath"

  substitutes:
    name: substitutes
    # Build what the Pi would otherwise compile, and push it to our Cachix so the
    # Pi only ever downloads. PRs compare against their base; pushes to main
    # against the previous main, so the cache also holds what gets deployed.
    # Fails only if a build fails or outruns the timeout.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    # The 6h job cap minus headroom. nodejs/V8 is the known worst case.
    timeout-minutes: 345
    # Job-level so the push step's `if` can see it; empty on fork PRs.
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The arm runner starts with ~14GB free; a V8-sized build needs more.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost || true
          df -h /
      - uses: DeterminateSystems/nix-installer-action@v22
      # Adds nsimon-nicos as a substituter, so paths already pushed read as
      # fetched below and are not rebuilt. Pushing is the explicit step at the end.
      - uses: cachix/cachix-action@v17
        with:
          name: nsimon-nicos
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: Find what rpi5 would newly build from source
        id: find
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          # --dry-run splits the closure into paths FETCHED and derivations BUILT
          # because no substituter has them. Compare by name, not store path: an
          # input bump rewrites every downstream hash. Output goes to a file, not
          # a pipe — piping it hid Nix's own error text under `pipefail`.
          built() {
            local out=$1
            if ! nix build --accept-flake-config --dry-run \
                 ".#nixosConfigurations.rpi5.config.system.build.toplevel" \
                 > "$out.raw" 2>&1; then
              echo "::error::nix build --dry-run failed for $out — output follows."
              cat "$out.raw"
              exit 1
            fi
            awk '/will be built/{f=1;next} /will be fetched/{f=0}
                 f && /^ *\/nix\/store\//{sub(/^ */,"");print}' "$out.raw" \
              | sort -u > "$out.drvs"
            sed -E 's|^/nix/store/[a-z0-9]{32}-||; s|\.drv$||' "$out.drvs" \
              | sort -u > "$out"
          }

          head_sha=$(git rev-parse HEAD)
          built /tmp/head.txt
          git checkout --quiet --force "$BASE"
          built /tmp/base.txt
          git checkout --quiet --force "$head_sha"

          comm -23 /tmp/head.txt /tmp/base.txt > /tmp/new.txt
          # Back from names to the head's .drv paths, which is what gets built.
          awk 'NR==FNR{want[$0];next}
               {n=$0; sub(/^\/nix\/store\/[a-z0-9]{32}-/,"",n); sub(/\.drv$/,"",n)}
               n in want' /tmp/new.txt /tmp/head.txt.drvs > /tmp/new.drvs

          if [ ! -s /tmp/new.drvs ]; then
            echo "No new from-source builds on rpi5." >> "$GITHUB_STEP_SUMMARY"
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # shellcheck disable=SC2016  # literal backticks: markdown code spans
          {
            echo "### Built here instead of on rpi5"
            echo
            sed 's/^/- `/; s/$/`/' /tmp/new.txt
          } >> "$GITHUB_STEP_SUMMARY"
          echo "count=$(wc -l < /tmp/new.drvs)" >> "$GITHUB_OUTPUT"

      - name: Build them
        if: steps.find.outputs.count != '0'
        run: |
          sed 's|$|^*|' /tmp/new.drvs \
            | xargs nix build --accept-flake-config --print-build-logs \
                --no-link --print-out-paths > /tmp/outs.txt
          wc -l < /tmp/outs.txt

      # Fork PRs get no secrets: they still build, they just cannot push.
      - name: Push to Cachix
        if: steps.find.outputs.count != '0' && env.CACHIX_AUTH_TOKEN != ''
        run: cachix push nsimon-nicos < /tmp/outs.txt

  scripts:
    name: scripts
    # x86_64 on purpose: nicos-scripts is pure Python and its checks are meant to
    # be runnable off the Pi. This is the exact command CLAUDE.md documents.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: Run the nicos-scripts test suite
        run: nix build --accept-flake-config --print-build-logs .#checks.x86_64-linux.nicos-scripts
