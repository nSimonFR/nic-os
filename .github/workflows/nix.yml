# Evaluate every host and run the script tests, on every PR.
#
# Until now nothing did. garnix went away on 2026-07-15 (docs/adr — see the
# known-issue note) and took the only build/eval feedback with it, so a PR that
# broke evaluation merged clean and was discovered by hand. That matters more
# here than in most repos: auto-upgrade.nix runs `nix flake update` + rebuild +
# reboot unattended every Sunday at 05:00 on a headless Pi whose documented
# recovery path is a physical power-cycle.
#
# Eval, not build. `system.build.toplevel.drvPath` forces the whole module tree —
# every module imported, every option merged, every `assertions` entry checked —
# without building a single derivation. That is the class of breakage worth
# catching (a bad flake input, a renamed option, a failed assertion, a typo'd
# path) and it costs a couple of minutes instead of an hour of ARM compilation.
#
# Everything runs on aarch64. The rpi5 config *needs* it: aperture-sync.nix reads
# the model list out of the claude-code binary with `builtins.readFile`, which is
# import-from-derivation — evaluating it builds an aarch64 derivation, so an
# x86_64 runner would need QEMU. `ubuntu-24.04-arm` is a native ARM runner, free
# for public repos. The other two configs evaluate fine there too (evaluating an
# x86_64 or a Darwin system is architecture-independent as long as no IFD is in
# the way, and neither has any), so one runner label covers all three.
name: Nix

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A force-push should cancel the run it superseded rather than queue behind it.
concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval:
    name: eval ${{ matrix.host }}
    runs-on: ubuntu-24.04-arm
    strategy:
      # One broken host should still report on the other two — the usual reason
      # a config breaks is a shared module, and knowing whether it took all
      # three down or just one is most of the diagnosis.
      fail-fast: false
      matrix:
        include:
          - host: rpi5
            output: nixosConfigurations
          - host: BeAsT
            output: nixosConfigurations
          - host: nBookPro
            output: darwinConfigurations
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      # --accept-flake-config: the flake declares nixos-raspberrypi.cachix.org,
      # which is what keeps the rpi5 job from building its inputs from source.
      - name: Evaluate ${{ matrix.host }}
        run: |
          nix eval --accept-flake-config --raw \
            ".#${{ matrix.output }}.${{ matrix.host }}.config.system.build.toplevel.drvPath"

  substitutes:
    name: substitutes
    # PRs only — the question is "what does this PR newly make the Pi compile",
    # which needs a base to compare against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: Compare what would be built from source, PR vs base
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # --dry-run splits the closure in two: paths that will be FETCHED and
          # derivations that will be BUILT because no substituter has them. Only
          # the second half costs the Pi anything, and it is invisible from a
          # diff — a flake bump that reads as fifteen harmless rev changes can
          # land a core package the aarch64 Hydra jobs have not caught up on.
          # Compare by name, not by store path: an input bump rewrites the hash
          # of everything downstream, so path-level diffing is all noise.
          built() {
            nix build --accept-flake-config --dry-run \
              ".#nixosConfigurations.rpi5.config.system.build.toplevel" 2>&1 \
              | awk '/will be built/{f=1;next} /will be fetched/{f=0}
                     f && /^ *\/nix\/store\//{sub(/^ */,"");print}' \
              | sed -E 's|^/nix/store/[a-z0-9]{32}-||; s|\.drv$||' \
              | sort -u
          }

          head_sha=$(git rev-parse HEAD)
          built > /tmp/head.txt
          git checkout --quiet --force "$BASE"
          built > /tmp/base.txt
          git checkout --quiet --force "$head_sha"

          comm -23 /tmp/head.txt /tmp/base.txt > /tmp/new.txt

          if [ ! -s /tmp/new.txt ]; then
            echo "No new from-source builds on rpi5." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### Newly built from source on rpi5"
            echo
            echo 'Not substitutable from any configured cache, so the Pi compiles them:'
            echo
            sed 's/^/- `/; s/$/`/' /tmp/new.txt
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::This PR adds $(wc -l < /tmp/new.txt) from-source build(s) on rpi5 (see the job summary)."
          sed 's/^/  /' /tmp/new.txt

          # Not a lint. nodejs 26.9.0 arrived exactly this way and cost ~4h of V8
          # on the Pi, with earlyoom killing the first attempt. If the build is
          # genuinely wanted, say so in the PR and merge past this check.
          exit 1

  scripts:
    name: scripts
    # x86_64 on purpose: nicos-scripts is pure Python and its checks are meant to
    # be runnable off the Pi. This is the exact command CLAUDE.md documents.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: Run the nicos-scripts test suite
        run: nix build --accept-flake-config --print-build-logs .#checks.x86_64-linux.nicos-scripts
