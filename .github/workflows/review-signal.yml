# Wakes review-gate.yml when a review or a review comment changes: either can
# make or void an approval the gate reads. A resolved thread raises no Actions
# event; it matters through the CodeRabbit review it leads to. These events
# run the workflow file of the PR itself, so this one holds no token and no
# secret: it only starts the gate, which runs from main and re-reads everything.
name: Review signal

on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited]

permissions: {}

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Something the gate reads changed; review-gate.yml takes it from here."
