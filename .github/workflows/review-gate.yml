# Review gate: posts the `review-gate` status that ruleset `main` requires.
# Green on the PR head when Nico approved that commit, or when CodeRabbit
# approved an agent PR that stays small and away from protected paths
# (.github/scripts/review_gate.py). auto-merge.yml has armed every PR, so
# GitHub merges once this and the CI checks are green. Agent PRs it will not
# pass get `needs-human`.
#
# The ruleset accepts the status only from GitHub Actions (integration 15368):
# no workflow a PR triggers may hold `statuses` or `checks` write, no job may be
# named `review-gate`, and nSimonFR-ai's token must never get the `workflow` scope.
#
# Every trigger here runs this file and the script from main, never from a PR:
# pull_request_target (a new head starts pending), workflow_run of
# review-signal.yml (CodeRabbit or Nico reviewed) and a schedule (sweep).
name: Review gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_run:
    workflows: [Review signal]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  gate:
    runs-on: ubuntu-latest
    # A review signal counts only when its job ran, i.e. CodeRabbit or Nico reviewed.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    # Never cancel a running gate. A queued run that a newer one replaces loses
    # nothing: every run sweeps all open PRs.
    concurrency:
      group: review-gate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # Full tree: review_gate.py checks its patterns against main's files.
          ref: main

      - name: Gate open PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          prs=$( {
            gh api --paginate "repos/$REPO/pulls?state=open&base=main&per_page=100" --jq '.[].number'
            [ -n "$EVENT_PR" ] && echo "$EVENT_PR"
          } | sort -un)
          decide() {
            gh api --paginate --slurp "repos/$REPO/pulls/$1/reviews" > reviews.json
            # Fail closed: a crash is pending on the head.
            python3 -I .github/scripts/review_gate.py pr.json files.json reviews.json > d.json ||
              jq '{ok:false, reasons:["review_gate.py failed"], label:"needs-human", head:.head.sha,
                   state:"pending", description:"The gate failed: Nico reviews"}' pr.json > d.json
          }
          failed=0
          for pr in $prs; do
            gh api "repos/$REPO/pulls/$pr" > pr.json
            [ "$(jq -r .base.ref pr.json)" = main ] || continue
            gh api --paginate --slurp "repos/$REPO/pulls/$pr/files" > files.json
            decide "$pr"
            # Re-read the reviews right before going green: a dismissal since the
            # first read must stop it.
            [ "$(jq -r .state d.json)" = success ] && decide "$pr"
            head=$(jq -r .head d.json)
            state=$(jq -r '.state // ""' d.json)
            desc=$(jq -r .description d.json)
            # Statuses only append: post when the latest one differs.
            cur=$(gh api "repos/$REPO/commits/$head/status" \
              --jq '.statuses[] | select(.context == "review-gate") | .state + "|" + .description')
            if [ -n "$state" ] && [ "$cur" != "$state|$desc" ]; then
              gh api -X POST "repos/$REPO/statuses/$head" -f context=review-gate \
                -f state="$state" -f description="$desc" -f target_url="$RUN_URL" > /dev/null || failed=1
            fi
            # Labels from the decision. Only fixed values leave the JSON:
            # filenames stay inside it.
            case "$(jq -r '.label // ""' d.json)" in
              needs-human) gh pr edit "$pr" --repo "$REPO" --add-label needs-human --remove-label auto-merge-eligible ;;
              auto-merge-eligible) gh pr edit "$pr" --repo "$REPO" --add-label auto-merge-eligible --remove-label needs-human ;;
              *) gh pr edit "$pr" --repo "$REPO" --remove-label needs-human --remove-label auto-merge-eligible ;;
            esac
            jq -c --arg pr "$pr" '{pr: $pr, ok, label, state, reasons}' d.json >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$failed"
