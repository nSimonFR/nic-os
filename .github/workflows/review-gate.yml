# Review gate: posts the `review-gate` status that ruleset `main` requires.
# Green on the PR head when Nico approved that commit, or when CodeRabbit
# approved an agent PR that stays small and away from protected paths
# (.github/scripts/review_gate.py). auto-merge.yml has armed every PR, so
# GitHub merges once this and the CI checks are green. Agent PRs it will not
# pass get `needs-human`.
#
# The ruleset accepts the status only from GitHub Actions (integration 15368):
# no workflow a PR triggers may hold `statuses` or `checks` write, no job may be
# named `review-gate`, and nSimonFR-ai's token must never get the `workflow` scope.
#
# pull_request_target (a new head starts pending), workflow_run of
# review-signal.yml (CodeRabbit or Nico reviewed) and the schedule (sweep) run
# this file from main. A dispatch runs it from the ref it names (dispatch with
# `--ref main`); every trigger checks the script out from main.
name: Review gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_run:
    workflows: [Review signal]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  gate:
    runs-on: ubuntu-latest
    # A review signal counts only when its job ran, i.e. CodeRabbit or Nico reviewed.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    # Never cancel a running gate. A queued run that a newer one replaces loses
    # nothing: every run sweeps all open PRs.
    concurrency:
      group: review-gate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # Full tree: review_gate.py checks its patterns against main's files.
          ref: main

      - name: Gate open PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          list=$(gh api --paginate "repos/$REPO/pulls?state=open&base=main&per_page=100" --jq '.[].number') ||
            { echo "::error::Could not list the open PRs"; exit 1; }
          prs=$( { printf '%s\n' "$list"; [ -n "$EVENT_PR" ] && echo "$EVENT_PR"; } | sort -un)
          set -o pipefail
          # Files come from the compare of two SHAs, so they describe the head in
          # pr.json whatever is pushed meanwhile; reviews count only on that head.
          # Returns 1 when a read fails, 2 when review_gate.py crashed (d.json then
          # holds the fail-closed decision: pending, nothing on Renovate's PRs).
          decide() {
            gh api "repos/$REPO/pulls/$1" > pr.json || return 1
            seen=$(jq -r .head.sha pr.json)
            gh api --paginate "repos/$REPO/compare/$(jq -r .base.sha pr.json)...$seen?per_page=100" \
              --jq '.files' | jq -s . > files.json &&
              gh api --paginate --slurp "repos/$REPO/pulls/$1/reviews" > reviews.json ||
              return 1
            python3 -I .github/scripts/review_gate.py pr.json files.json reviews.json > d.json && return 0
            jq '{ok:false, reasons:["review_gate.py failed"], label:"needs-human", head:.head.sha, crashed:true,
                 state:(if .user.login == "nic-os-renovate[bot]" then null else "pending" end),
                 description:"The gate failed: Nico reviews"}' pr.json > d.json && return 2
            return 1
          }
          # Two tries. A crash fails the run but keeps its fail-closed decision;
          # an unreadable PR fails the run and goes to unreadable().
          attempt() {
            seen='' rc=0
            decide "$1" || rc=$?
            [ "$rc" -eq 0 ] || { rc=0; decide "$1" || rc=$?; }
            [ "$rc" -eq 0 ] && return 0
            failed=1
            [ "$rc" -eq 2 ] && return 0
            unreadable "$1" || true
            return 1
          }
          # Our latest review-gate status on a commit, as state|description. Read
          # from the full list: the combined endpoint shows only the latest of any
          # publisher, so another one's status would hide ours.
          ours() {
            gh api --paginate "repos/$REPO/commits/$1/statuses?per_page=100" --jq '.[]
              | select(.context == "review-gate" and .creator.login == "github-actions[bot]")
              | .state + "|" + .description' | sed -n 1p
          }
          # The head that could not be decided loses its green status, if the PR
          # still points at it. Renovate's keeps it: a pending one stops its automerge.
          unreadable() {
            [ -n "$seen" ] || return 0
            now=$(gh api "repos/$REPO/pulls/$1" \
              --jq 'select(.state == "open" and .base.ref == "main" and .user.login != "nic-os-renovate[bot]") | .head.sha')
            [ "$now" = "$seen" ] || return 0
            st=$(ours "$seen")
            [ "${st%%|*}" = success ] || return 0
            gh api -X POST "repos/$REPO/statuses/$seen" -f context=review-gate -f state=pending \
              -f description="The gate could not re-check this commit" -f target_url="$RUN_URL" > /dev/null &&
              jq -nc --arg pr "$1" --arg head "$seen" '{pr: $pr, head: $head, posted: "pending"}' >> "$GITHUB_STEP_SUMMARY"
          }
          failed=0
          for pr in $prs; do
            attempt "$pr" || continue
            [ "$(jq -r .base.ref pr.json)" = main ] || continue
            # Decide again right before going green: a dismissal since the first
            # read must stop it.
            if [ "$(jq -r .state d.json)" = success ]; then
              attempt "$pr" || continue
              [ "$(jq -r .base.ref pr.json)" = main ] || continue
            fi
            head=$(jq -r .head d.json)
            state=$(jq -r '.state // ""' d.json)
            desc=$(jq -r .description d.json)
            # Statuses only append: post when our latest one differs.
            cur=$(ours "$head") || { failed=1; continue; }
            # Renovate gets no status until Nico approves; a withdrawn approval
            # still has to turn its green one back.
            if [ -z "$state" ] && [ -n "$cur" ] && [ "$(jq -r '.crashed // false' d.json)" = false ]; then
              state=pending desc="Nico's approval no longer stands"
            fi
            posted=
            if [ -n "$state" ] && [ "$cur" != "$state|$desc" ]; then
              gh api -X POST "repos/$REPO/statuses/$head" -f context=review-gate \
                -f state="$state" -f description="$desc" -f target_url="$RUN_URL" > /dev/null ||
                { failed=1; continue; }
              posted=$state
            fi
            # A dismissal read after the decision but before the POST: check once
            # more and take the green back. The run it queued is the backstop.
            if [ "$posted" = success ] && attempt "$pr" &&
              [ "$(jq -r .head d.json)" = "$head" ] && [ "$(jq -r .state d.json)" != success ]; then
              gh api -X POST "repos/$REPO/statuses/$head" -f context=review-gate -f state=pending \
                -f description="Nico's approval no longer stands" -f target_url="$RUN_URL" > /dev/null ||
                { failed=1; continue; }
              posted=pending
            fi
            # Labels from the decision. Only fixed values leave the JSON:
            # filenames stay inside it.
            case "$(jq -r '.label // ""' d.json)" in
              needs-human) gh pr edit "$pr" --repo "$REPO" --add-label needs-human --remove-label auto-merge-eligible ;;
              auto-merge-eligible) gh pr edit "$pr" --repo "$REPO" --add-label auto-merge-eligible --remove-label needs-human ;;
              *) gh pr edit "$pr" --repo "$REPO" --remove-label needs-human --remove-label auto-merge-eligible ;;
            esac || failed=1
            jq -c --arg pr "$pr" --arg posted "$posted" '{pr: $pr, ok, label, state, posted: $posted, reasons}' d.json >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$failed"
