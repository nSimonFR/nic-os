# The home-level user patch layer ($DSH_HOME/cordis.patch.yml), applied over
# every dsh profile after its bundle layers. This is the Aperture provider —
# the whole of pi's `extensions/aperture-provider.ts`, as data.
#
# dsh's LLM adapter *is* pi-ai (@deepseek-ai/dsh-llm-pi-ai), the same library
# pi uses, so the route needs no code: a baseURL plus `api: openai-completions`
# is exactly what pi.registerProvider() was building by hand.
#
# Patch grammar: a top-level list. An entry carrying an `id` targets that row
# in the composed tree and REPLACES its whole `config` (no deep merge); an
# entry carrying `insert:` adds new rows. Row ids come from
# @deepseek-ai/dsh-base's own cordis.patch.yml.
#
# PRECEDENCE: $DSH_HOME/settings.yaml outranks this file — the Web UI's
# Settings → Models page writes there, which is why settings.yaml is
# deliberately NOT Nix-managed (same reasoning as pi's ~/.pi/agent/auth.json).
# If a UI edit ever shadows this route, drop its `llm-pi-ai:` section from
# settings.yaml to fall back here.

# Every model goes through the Aperture observability gateway →
# tiny-llm-gate (:4001) → codex-proxy (:4040) or beast Ollama.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      aperture:
        displayName: Aperture
        # tiny-llm-gate ignores the key, but pi-ai refuses a route whose
        # credential does not resolve (MISSING_CREDENTIAL). The wrapper in
        # default.nix sets this to a dummy, scoped to the dsh binary.
        apiKeyEnv: APERTURE_API_KEY
        api: openai-completions
        baseURL: https://ai.gate-mintaka.ts.net/v1
        headers:
          # Aperture only reconstructs sessions by itself on the Anthropic
          # path (`ancc_` ids). On openai-completions it reads this header and
          # merges every request carrying the same value into one session
          # (`xsid_`); with no header it mints a random id per request
          # (`xrnd_`), which is why pi and Sure each show up as N one-request
          # rows. Verified against the live gate: three requests sharing a
          # value collapsed to one row with request_count=3.
          #
          # `headers` is route config, evaluated once per process, so the
          # granularity this buys is per-PROCESS, not per-conversation:
          #   `dsh-run` (headless) — one process per invocation, so one
          #      Aperture session per run. Exactly right.
          #   `dsh web` — one process serving every conversation, so one
          #      bucket per service lifetime. Coarse, but the unit idle-stops
          #      after 15 min, so buckets rotate rather than growing forever.
          # Per-conversation grouping would need a Cordis plugin injecting the
          # live session id per request, which means an out-of-tree pnpm
          # install into the profile — deliberately not done here.
          #
          # Expression must not START with a quote: after a `!!js` tag YAML
          # reads `'dsh-'` as a complete quoted scalar and then fails on the
          # rest of the line.
          x-session-id: !!js process.pid.toString(36) + '-' + Date.now().toString(36)
        # No User-Agent here. pi's extension set one to tell itself apart in
        # Aperture; dsh would ignore it — a route's `headers` lose reserved
        # names to the harness's own attribution, and it already sends
        # `deepseek-harness/<version>`, confirmed in the Aperture session log.
        # pi-ai picks a request shape from the endpoint's URL, and a private
        # gateway's URL tells it nothing — so it addresses tlg as if it were
        # OpenAI itself and sends `role: developer` + `max_completion_tokens`,
        # which tlg's chat/completions route does not take.
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        # Hand-maintained subset of `curl .../v1/models`, filtered the way
        # pi's extension filtered: no embeddings, no `openai/*` aliases, no
        # `claude-*` (Anthropic has its own route), no codex-auto-review.
        # Unset fields fall back to the route defaults (262144 context /
        # 32768 max tokens); correct one only when a real request proves it
        # wrong.
        models:
          - id: gpt-5.5          # ChatGPT subscription via codex-proxy — the default
          - id: gpt-5.6
          # gpt-5.5-mini is deliberately absent. A hand-declared model takes
          # the route's 262144 fallback, and the mini answered dsh's system
          # prompt + tool schemas with a hard 400 CONTEXT_WINDOW_EXCEEDED.
          # Re-add it with a `contextWindow:` someone has actually verified,
          # not a guessed number.
          - id: gemma4:e4b       # beast Ollama, free local
          - id: gemma4:26b
          - id: auto             # tlg's beast-first, codex-fallback route

# Without this, new agents default to deepseek-official/deepseek-v4-flash and
# ask for a DEEPSEEK_API_KEY we do not have.
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: aperture
    model: gpt-5.5
