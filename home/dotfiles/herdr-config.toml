# herdr client/server config — ~/.config/herdr/config.toml, wired as an
# out-of-store symlink in home/herdr.nix.
#
# WRITABLE ON PURPOSE: herdr edits this file itself (`onboarding`, the theme
# picker, `herdr config` subcommands), so it cannot be a read-only store path.
# The trade is the same one home/dotfiles/claude-settings.json makes — runtime
# edits land in the checkout and show up as a repo diff, which is how they get
# captured rather than lost.

onboarding = false

[ui]
# Right-aligned status area — herdr's only session-wide, NON-CLICKABLE surface.
# The sidebar was the other candidate and was rejected twice over: every row
# there is a navigation target, and rate limits are per ACCOUNT, so a space row
# would repeat the same number once per space.
#
# `herdr-usage-bar` is the writeShellApplication wrapper from home/herdr.nix; it
# pins the interpreter and runs home/herdr/usage-bar.py. Called by name, not by
# store path, so a rebuild cannot leave a dangling command here.
#
# 60s is the RENDER interval, not the fetch interval — the script caches, and
# api.anthropic.com/api/oauth/usage answers 429 if actually polled this often.
# timeout covers the ~1s `codex app-server` handshake on a cache miss.
tab_bar_right = [
  { type = "command", command = "herdr-usage-bar", interval_seconds = 60, timeout_seconds = 20 },
]
tab_bar_right_separator = " · "

# Claude's own session name in the agent panel. `/rename` is pushed into the
# TERMINAL TITLE, which herdr already captures per pane — no hook needed.
#
# Two rows, not herdr's documented three: the dropped one was `agent`, which
# said "claude" under every entry. The kind moves up as a two-letter code, which
# cannot be a literal (tokens are a closed set) — `agent` renders `display_agent`
# and home/scripts/herdr-agent-code.sh reports `cc`.
#
# No `fg` on the title: a row token takes hex only, so a colour here would stop
# following [theme]. Bold + un-dimmed inherits the theme's own colour.
[ui.sidebar.agents.rows_by_agent]
claude = [
  [
    "state_icon",
    "agent",
    "machine",
    "workspace",
    "tab",
  ],
  [
    { token = "terminal_title_stripped", bold = true, dim = false },
  ],
]

[ui.toast]
delivery = "terminal"

# zoetrope — the subagent view. Focus a Claude Code pane and press it: `zoe`
# draws that session as a flow graph with the turn's SUBAGENTS nested, which
# nothing else shows. Needs `herdr plugin install furkankly/zoetrope/herdr-plugin`
# (declared in home/herdr.nix); the binary is nix-managed.
#
# Written here rather than by the plugin's `setup-keys` action, which makes the
# same edit at runtime and leaves a config.toml.bak-* in the checkout.
# `.open-split` / `.open-tab` place the graph beside the agent instead of over it.
[[keys.command]]
key = "prefix+shift+z"
type = "plugin_action"
command = "furkankly.zoetrope.open"
description = "zoetrope: session graph (overlay)"

[theme]
name = "tokyo-night"
auto_switch = false
