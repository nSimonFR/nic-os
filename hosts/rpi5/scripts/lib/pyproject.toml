[build-system]
requires = [ "setuptools>=68" ]
build-backend = "setuptools.build_meta"

[project]
name = "nicos-scripts"
version = "0.1.0"
description = "Shared library + entry points for the nic-os rpi5 Python scripts"
requires-python = ">=3.11"
# Near-stdlib on purpose: these run on a 3.9 GB Pi and an undeclared third-party
# import used to mean a failure at 04:50 on a timer. Anything added here must be a
# real dependency in pkgs/nicos-scripts.nix too — that is the point of declaring it.
#
# psycopg2: papra.nc_sync writes Nextcloud systemtags straight into Postgres. It
# is imported lazily inside connect_pg(), so the module (and its tests) still load
# without it.
dependencies = [ "psycopg2" ]

# One console script per connector. This is the interface the systemd units use
# (`${pkgs.nicos-scripts}/bin/steam-to-ryot`), replacing
# `${pkgs.python3}/bin/python3 ${./scripts/steam-to-ryot.py}` — a bare file in
# the store with no importable sibling, hence no shared lib and no tests.
[project.scripts]
steam-to-ryot = "nicos_scripts.connectors.steam:main"
spotify-to-ryot = "nicos_scripts.connectors.spotify:main"
scale-to-ryot = "nicos_scripts.connectors.scale:main"
moxfield-sync = "nicos_scripts.connectors.moxfield:main"
travel-cal-sync = "nicos_scripts.connectors.travel_cal:main"
# Windows remote ICS feeds down to a date range so Calino can subscribe to them
# without blowing the browser's ~5 MB localStorage quota (the TRUSK feed alone is
# 6234 events / 9.8 MB). Fetches server-side, so it needs no CORS passthrough.
ics-mirror = "nicos_scripts.connectors.ics_mirror:main"
sure-to-wealthfolio = "nicos_scripts.connectors.wealthfolio:main"
homepage-stats = "nicos_scripts.homepage.stats:main"
claude-notify-aggregator = "nicos_scripts.claude.notify_aggregator:main"
claude-rc-boot-resume = "nicos_scripts.claude.boot_resume:main"
claude-memory-sync = "nicos_scripts.claude.memory_sync:main"
claude-context-baseline = "nicos_scripts.claude.context_baseline:main"
# Hand-run, not on a timer: adopting someone else's shared-album photos into my
# own library is a deliberate act (it makes a second copy on disk). Lives here
# anyway so it gets the shared helpers and the tests.
immich-adopt = "nicos_scripts.immich.adopt:main"
# Reports on a QUEUE, not a log line: the alert it replaced grepped sure-worker
# for a failure message, so it could not see AutoCategorizeJob never running at
# all (8-day silent stall, 2026-09-02).
sure-categorize-health = "nicos_scripts.sure.categorize_health:main"
# The cause of that stall: sure-worker sleeps with the web tier regardless of
# queue depth, so it was awake ~7 min/day against hours of queued LLM work.
sure-drain-keepalive = "nicos_scripts.sure.drain_keepalive:main"
# Hand-run, deliberately NOT on a timer: it writes rules, and the rules are the
# durable fix — once a name has one, Sure applies it on every sync for free, so
# there is nothing left to re-run on a schedule. Re-run it by hand when enough
# new merchants have accumulated to be worth a pass.
sure-derive-rules = "nicos_scripts.sure.derive_rules:main"
papra-tag-sweep = "nicos_scripts.papra.tag_sweep:main"
papra-proton-poll = "nicos_scripts.papra.proton_poll:main"
papra-nc-sync = "nicos_scripts.papra.nc_sync:main"
# hermes-*: Hermes cron jobs that used to drive an LLM to reach a deterministic
# answer. Invoked by the scheduler in `no_agent` mode through the `*.sh` shims in
# hosts/rpi5/hermes/hermes.nix, so stdout is the delivered message.
hermes-dawarich-daily = "nicos_scripts.hermes.dawarich_daily:main"
hermes-calendar-digest = "nicos_scripts.hermes.calendar_digest:main"
hermes-zen-watch = "nicos_scripts.hermes.zen_watch:main"
# Runs in hermes' ExecStartPre, not on a schedule: the bindings it checks live in
# untracked jobs.json, so nothing else can catch a renamed shim.
hermes-cron-check = "nicos_scripts.hermes.cron_check:main"
# Hand-run in a herdr pane: a read-only live view of the Telegram sessions.
hermes-watch = "nicos_scripts.hermes.watch:main"

[tool.setuptools.packages.find]
include = [ "nicos_scripts*" ]

[tool.pytest.ini_options]
testpaths = [ "tests" ]
# So a bare `pytest` in this directory finds nicos_scripts without an install or
# a PYTHONPATH export. (In the Nix build the package is installed too, and
# pythonImportsCheck covers that copy.)
pythonpath = [ "." ]
