# CVEs reviewed and accepted for rpi5 (.github/workflows/vulnix.yml).
# Always give `until`, so an entry is re-reviewed instead of hiding forever:
#
# ["pname"]
# cve = ["CVE-2026-0000"]
# until = "2026-12-31"
# comment = "why it does not apply / what we wait for"

# Name collisions, reviewed 2026-10-23 on the 26.05 closure. Version-pinned so the
# real package of the same name (e.g. the redis server) still reports.

["orc-0.4.41"]
cve = ["CVE-2025-47436"]
until = "2027-04-23"
comment = "GStreamer orc; the CVE is Apache ORC (Java/C++ columnar format)"

["orc-0.4.44"]
cve = ["CVE-2025-47436"]
until = "2027-04-23"
comment = "GStreamer orc; the CVE is Apache ORC"

["lapack-3"]
